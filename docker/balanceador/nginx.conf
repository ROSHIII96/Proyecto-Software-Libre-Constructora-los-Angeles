# Balanceador nginx: reparte entre TODAS las replicas del servicio "chamilo".
# Diferencia con el ejemplo del profesor (compose_loadbalancer): en vez de nombres fijos
# de contenedor (que cambian entre versiones de Compose), pregunta al DNS interno de
# Docker (127.0.0.11) cada 5 s quienes estan vivos. Un contenedor detenido deja de recibir
# trafico y uno nuevo se incorpora solo, sin recargar nginx.

log_format balanceo '$remote_addr [$time_local] "$request" $status -> $upstream_addr';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log balanceo;
    client_max_body_size 100m;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # Comprobacion de salud del propio balanceador
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $destino http://chamilo:80;
        proxy_pass $destino;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 2s;
        proxy_read_timeout    300s;
        # Si una replica falla, reintenta con otra (no reintenta POST: evita enviar dos veces un examen)
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;

        # Para la demostracion: muestra que replica atendio la peticion
        add_header X-Servidor $upstream_addr always;
    }
}
