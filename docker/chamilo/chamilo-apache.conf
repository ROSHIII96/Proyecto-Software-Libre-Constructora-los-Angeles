# Apache DENTRO del contenedor de Chamilo
ServerName localhost
ServerTokens Prod
ServerSignature Off

# Chamilo necesita que se interpreten sus .htaccess (mod_rewrite)
<Directory /var/www/html>
    AllowOverride All
    Require all granted
</Directory>

# Detras del proxy: el cliente uso HTTPS aunque este ultimo tramo sea HTTP
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
