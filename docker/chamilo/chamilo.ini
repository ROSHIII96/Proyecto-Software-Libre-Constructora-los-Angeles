; Ajustes de PHP para Chamilo 1.11 (la guia oficial recomienda estos valores)
date.timezone = America/Costa_Rica
memory_limit = 256M
max_execution_time = 300
max_input_time = 600
max_input_vars = 5000
post_max_size = 100M
upload_max_filesize = 100M
short_open_tag = Off
; El instalador exige display_errors = Off
display_errors = Off
log_errors = On
; Chamilo 1.11 sobre PHP 8.x genera avisos de "deprecated": no se muestran
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
expose_php = Off
; Sesiones en un volumen compartido: si una replica cae, la otra conserva la sesion
session.save_path = "/sessions"
