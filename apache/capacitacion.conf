# /etc/apache2/sites-available/capacitacion.conf
# Apache (en el servidor) = unica entrada: HTTPS en el 443 y proxy hacia el balanceador en 127.0.0.1:8081

<VirtualHost *:80>
    ServerName capacitacion.losangeles.internal
    Redirect permanent / https://capacitacion.losangeles.internal/
</VirtualHost>

<VirtualHost *:443>
    ServerName capacitacion.losangeles.internal

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/capacitacion.crt
    SSLCertificateKeyFile /etc/ssl/private/capacitacion.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8081/ timeout=300
    ProxyPassReverse / http://127.0.0.1:8081/

    ErrorLog  ${APACHE_LOG_DIR}/capacitacion-error.log
    CustomLog ${APACHE_LOG_DIR}/capacitacion-access.log combined
</VirtualHost>
