server {
    listen 80;
    server_name capacitacion.losangeles.internal www.losangeles.internal losangeles.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name capacitacion.losangeles.internal www.losangeles.internal losangeles.internal;

    ssl_certificate /etc/ssl/losangeles/capacitacion.crt;
    ssl_certificate_key /etc/ssl/losangeles/capacitacion.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/capacitacion;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
