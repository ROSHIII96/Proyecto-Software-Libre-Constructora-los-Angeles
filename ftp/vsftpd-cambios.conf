# Lineas que deben quedar en /etc/vsftpd.conf (haga antes: sudo cp /etc/vsftpd.conf /etc/vsftpd.conf.bak)
# Las primeras cinco son las del curso (Sesion 8); las demas son del proyecto.
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES

pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

# Archivos nuevos: solo para su dueno (aislamiento entre usuarios)
local_umask=077
